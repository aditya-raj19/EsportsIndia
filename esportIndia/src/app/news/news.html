<div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
  <div class="flex items-center justify-between mb-8">
    <h2 class="text-3xl font-rajdhani font-bold text-slate-900 dark:text-white">
      Latest <span class="text-blue-600 dark:text-purple-400">News</span>
    </h2>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (article of newsArticles; track article.title) {
      <div class="bg-white border-slate-200 shadow-sm hover:shadow dark:shadow-none dark:bg-white/[0.02] border dark:border-white/5 rounded-2xl overflow-hidden hover:bg-slate-50 dark:hover:bg-white/[0.04] dark:hover:border-white/10 transition-all cursor-pointer group flex flex-col">
        <div class="h-48 overflow-hidden relative">
          <img [src]="article.image" [alt]="article.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
          <div class="absolute top-3 left-3 bg-blue-600/90 dark:bg-purple-600/90 backdrop-blur text-white text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded">
            {{ article.category }}
          </div>
        </div>
        <div class="p-5 flex flex-col flex-1">
          <div class="text-slate-500 dark:text-white/40 text-[11px] uppercase tracking-wider mb-2">
            {{ article.date }}
          </div>
          <h3 class="text-slate-900 dark:text-white font-semibold mb-2 group-hover:text-blue-600 dark:group-hover:text-purple-400 transition-colors line-clamp-2">
            {{ article.title }}
          </h3>
          <p class="text-slate-600 dark:text-white/50 text-xs leading-relaxed line-clamp-3">
            {{ article.excerpt }}
          </p>
        </div>
      </div>
    }
  </div>
</div>
