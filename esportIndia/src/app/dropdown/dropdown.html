<div class="relative w-full">
  <button (click)="toggle()" type="button" class="w-full flex items-center justify-between bg-white border border-slate-200 text-slate-900 hover:border-slate-300 hover:bg-slate-50 dark:bg-white/5 dark:border-purple-500/30 dark:text-white text-sm rounded-xl p-3 outline-none dark:hover:border-purple-500/60 dark:hover:bg-white/10 transition-all shadow-sm">
    <span class="truncate">{{ selectedItem() || placeholder() }}</span>
    <svg class="w-4 h-4 text-blue-600 dark:text-purple-400 ml-3 flex-shrink-0 transition-transform" [class.rotate-180]="isOpen()" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
  </button>

  @if (isOpen()) {
    <div class="absolute z-50 w-full mt-2 bg-white border border-slate-200 shadow-sm dark:shadow-2xl dark:bg-[#12121a] dark:border-purple-500/30 dark:shadow-purple-900/20 rounded-xl overflow-hidden backdrop-blur-md">
      <ul class="max-h-64 overflow-y-auto py-1 custom-scrollbar">
        <li>
          <button (click)="selectItem(null)" 
                  class="w-full text-left px-4 py-3 text-sm transition-colors {{ selectedItem() === null ? 'bg-slate-100 text-blue-600 font-medium dark:bg-purple-500/20 dark:text-purple-300' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900 dark:text-white/80 dark:hover:bg-white/10 dark:hover:text-white' }}">
            {{ placeholder() }}
          </button>
        </li>
        @for (item of (items() || []); track item) {
          <li>
            <button (click)="selectItem(item)" 
                    class="w-full text-left px-4 py-3 text-sm truncate transition-colors {{ selectedItem() === item ? 'bg-slate-100 text-blue-600 font-medium dark:bg-purple-500/20 dark:text-purple-300' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900 dark:text-white/80 dark:hover:bg-white/10 dark:hover:text-white' }}">
              {{ item }}
            </button>
          </li>
        }
      </ul>
    </div>
  }
</div>
