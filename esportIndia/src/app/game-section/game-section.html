<section class="min-h-[calc(100vh-8rem)] bg-slate-50 dark:bg-[#0a0a0f] px-6 py-12 transition-colors duration-300">
  <div class="max-w-5xl mx-auto">
    <p class="text-blue-600 dark:text-purple-400 text-xs font-semibold uppercase tracking-widest">{{ section() }}</p>
    <h1 class="mt-2 text-4xl font-bold text-slate-900 dark:text-white">{{ heading() }}</h1>
    <div class="mt-10 rounded-2xl border border-slate-200 bg-white dark:bg-white/[0.03] dark:border-white/10 shadow-sm dark:shadow-none px-6 py-14 text-center text-slate-500 dark:text-white/55">
      {{ emptyMessage() }}
    </div>
  </div>
</section>
